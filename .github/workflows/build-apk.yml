name: Compilar APK Android TV

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar SDK y sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDK: $SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No hay sdkmanager preinstalado; descargando command-line tools oficiales..."
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            curl --fail --location --retry 3 --silent --show-error \
              "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" \
              -o "$RUNNER_TEMP/android-cmdline-tools.zip"
            mkdir -p "$RUNNER_TEMP/android-cmdline-tools"
            unzip -q "$RUNNER_TEMP/android-cmdline-tools.zip" -d "$RUNNER_TEMP/android-cmdline-tools"
            cp -a "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools/." "$SDK_ROOT/cmdline-tools/latest/"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "sdkmanager encontrado: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          # Redirigir respuestas, sin usar 'yes | ...' (causaba Broken pipe con pipefail).
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses < <(yes) > /dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar estructura
        run: python3 verify-project.py

      - name: Compilar APK debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: CleanTV-AndroidTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
